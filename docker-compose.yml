services:
  postgres:
    image: postgres:15-alpine
    container_name: confytickets-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-confy_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-confy_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-confytickets_db}
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/01_schema_ddl.sql:/docker-entrypoint-initdb.d/01_schema_ddl.sql:ro
      - ./database/03_dian_invoicing.sql:/docker-entrypoint-initdb.d/03_dian_invoicing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-confy_admin} -d ${POSTGRES_DB:-confytickets_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: confytickets-redis
    restart: unless-stopped
    ports:
      - "6389:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: confytickets-adminer
    restart: unless-stopped
    ports:
      - "8085:8080"
    depends_on:
      - postgres

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: confytickets-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://confy_admin:confy_secure_password_2026@postgres:5432/confytickets_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-True}
      PROJECT_NAME: ConfyTickets
      API_V1_STR: /api/v1
    volumes:
      - .:/app
    ports:
      - "8088:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
